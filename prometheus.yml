# Configuração do Prometheus para CryptoChain
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Regras de alerta
rule_files:
  - "alert_rules.yml"

# Configuração de scraping
scrape_configs:
  # CryptoChain API
  - job_name: 'cryptochain-api'
    static_configs:
      - targets: ['cryptochain:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
    
  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:8080']
    metrics_path: '/nginx_status'
    scrape_interval: 30s
    
  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s
    
  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s
    
  # Node Exporter (se disponível)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

# Configuração de alertas
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Configurações de retenção (usar --storage.tsdb.retention.time=30d na linha de comando)
