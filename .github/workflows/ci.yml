name: 🪙 CoinBalance CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.10"
  POETRY_VERSION: "1.6.1"

jobs:
  # Job de qualidade de código
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🎨 Format check (Black)
      run: black --check --diff .
      
    - name: 📋 Import sorting check (isort)
      run: isort --check-only --diff .
      
    - name: 🔍 Linting (Flake8)
      run: flake8 .
      
    - name: 🔬 Type checking (MyPy)
      run: mypy src/
      
    - name: 🔒 Security check (Bandit)
      run: bandit -r src/ -f json -o bandit-report.json || true

  # Job de testes
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: quality
    
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🧪 Run tests
      run: |
        pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=80 \
          --junitxml=test-results.xml
          
    - name: 📊 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  # Job de testes de performance
  performance:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: quality
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: ⚡ Run performance tests
      run: |
        pytest tests/performance/ -m performance --durations=10

  # Job de build e deploy
  build:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    needs: [test, performance]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🐳 Build Docker image
      run: |
        docker build -t coinbalance:${{ github.sha }} .
        docker tag coinbalance:${{ github.sha }} coinbalance:latest
        
    - name: 🚀 Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # TODO: Implementar deploy real
        echo "✅ Deploy completed successfully"

  # Job de notificação
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [quality, test, performance, build]
    if: always()
    
    steps:
    - name: 📢 Notify success
      if: ${{ needs.build.result == 'success' }}
      run: |
        echo "✅ All checks passed! CoinBalance is ready for production."
        
    - name: 📢 Notify failure
      if: ${{ needs.build.result == 'failure' }}
      run: |
        echo "❌ Some checks failed. Please review the logs."
        exit 1
