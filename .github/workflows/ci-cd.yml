name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Testes e Qualidade de Código
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy
    
    - name: Formatação de código (Black)
      run: black --check .
    
    - name: Linting (Flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Verificação de tipos (MyPy)
      run: mypy . --ignore-missing-imports
    
    - name: Executar testes
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
    
    - name: Upload cobertura
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml

  # Segurança
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Instalar dependências de segurança
      run: |
        pip install safety bandit
    
    - name: Verificar vulnerabilidades (Safety)
      run: safety check
    
    - name: Análise de segurança (Bandit)
      run: bandit -r . -f json -o bandit-report.json
    
    - name: Upload relatório de segurança
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: bandit-report.json

  # Build e Deploy
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build e push da imagem
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/cryptochain:latest
          ${{ secrets.DOCKER_USERNAME }}/cryptochain:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy para Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Deploy para Staging
      run: |
        echo "Deploying to staging environment..."
        # Implementar deploy para staging
    
  # Deploy para Produção
  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy para Produção
      run: |
        echo "Deploying to production environment..."
        # Implementar deploy para produção

  # Notificações
  notify:
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: always()
    
    steps:
    - name: Notificar Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#blockchain-dev'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()
