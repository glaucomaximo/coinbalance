
version: '3.8'

services:
  coinbalance-web3:
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8001:8001"
      - "9090:9090"  # Metrics
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://coinbalance:${DB_PASSWORD}@postgres:5432/coinbalance_prod
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=coinbalance_prod
      - POSTGRES_USER=coinbalance
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinbalance"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - coinbalance-web3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
