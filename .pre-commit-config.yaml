# Pre-commit hooks configuration for CoinBalance
# See https://pre-commit.com for more information

repos:
  # ========== GENERAL HOOKS ==========
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        description: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
        description: Ensure files end with a newline
      - id: check-yaml
        name: Check YAML
        description: Check YAML syntax
        args: ['--unsafe']
      - id: check-json
        name: Check JSON
        description: Check JSON syntax
      - id: check-toml
        name: Check TOML
        description: Check TOML syntax
      - id: check-xml
        name: Check XML
        description: Check XML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for merge conflict markers
      - id: check-added-large-files
        name: Check for large files
        description: Prevent large files from being committed
        args: ['--maxkb=1000']
      - id: check-case-conflict
        name: Check for case conflicts
        description: Check for case conflicts in filenames
      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for merge conflict markers
      - id: debug-statements
        name: Check for debug statements
        description: Check for debug statements (pdb, ipdb, etc.)
      - id: check-docstring-first
        name: Check docstring is first
        description: Check that docstrings appear before code

  # ========== PYTHON HOOKS ==========
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: Black Python Formatter
        description: Format Python code with Black
        language_version: python3.11
        args: ['--line-length=127']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort Import Sorter
        description: Sort Python imports with isort
        args: ['--profile=black', '--line-length=127']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Flake8 Linter
        description: Lint Python code with Flake8
        args: ['--max-line-length=127', '--extend-ignore=E203,W503']

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: Bandit Security Linter
        description: Security linting with Bandit
        args: ['-r', 'src/', '-f', 'json', '-o', 'bandit-report.json']
        exclude: '^tests/'

  - repo: https://github.com/pycqa/mypy
    rev: 1.8.0
    hooks:
      - id: mypy
        name: MyPy Type Checker
        description: Type checking with MyPy
        additional_dependencies: [types-requests, types-PyYAML]
        args: ['--ignore-missing-imports', '--no-strict-optional']

  - repo: https://github.com/pycqa/pylint
    rev: v3.0.3
    hooks:
      - id: pylint
        name: Pylint Linter
        description: Lint Python code with Pylint
        args: ['--disable=C0114,C0116', '--max-line-length=127']

  # ========== DOCUMENTATION HOOKS ==========
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: Pydocstyle Docstring Checker
        description: Check Python docstrings
        args: ['--convention=google']

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.0
    hooks:
      - id: pyupgrade
        name: PyUpgrade Python Upgrader
        description: Upgrade Python syntax to newer versions
        args: ['--py311-plus']

  # ========== SECURITY HOOKS ==========
  - repo: https://github.com/PyCQA/safety
    rev: 2.3.5
    hooks:
      - id: safety
        name: Safety Security Checker
        description: Check for known security vulnerabilities
        args: ['--json', '--output', 'safety-report.json']

  # ========== MARKDOWN HOOKS ==========
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        name: Markdown Linter
        description: Lint Markdown files
        args: ['--fix']

  # ========== YAML HOOKS ==========
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: YAML Linter
        description: Lint YAML files
        args: ['-d', 'relaxed']

  # ========== DOCKER HOOKS ==========
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint
        name: Dockerfile Linter
        description: Lint Dockerfiles with Hadolint

  # ========== GIT HOOKS ==========
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        name: Commitizen Commit Checker
        description: Check commit message format

  # ========== CUSTOM HOOKS ==========
  - repo: local
    hooks:
      - id: check-fractal-architecture
        name: Check Fractal Architecture
        description: Check if fractal architecture principles are followed
        entry: python scripts/check_architecture.py
        language: system
        files: '^src/.*\.py$'

      - id: check-conscious-systems
        name: Check Conscious Systems
        description: Check if conscious systems are properly implemented
        entry: python scripts/validate_disciplinas.py
        language: system
        files: '^src/infrastructure/fractal/.*\.py$'

      - id: generate-quality-report
        name: Generate Quality Report
        description: Generate quality report before commit
        entry: python scripts/generate_reports.py
        language: system
        always_run: true

# ========== CONFIGURATION ==========
default_language_version:
  python: python3.11

default_stages: [commit, push]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false