# GitHub Pages Configuration

# Site settings
title: "CoinBalance - A Economia da Consciência"
description: "Uma blockchain consciente e infinitamente escalável baseada em arquitetura fractal"
url: "https://coinbalance.github.io"
baseurl: "/coinbalance"

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - ROADMAP.md
  - CHANGELOG.md
  - .gitignore
  - .gitattributes
  - .github/
  - .pre-commit-config.yaml
  - renovate.json
  - pyproject.toml
  - pytest.ini
  - requirements.txt
  - requirements-dev.txt
  - Dockerfile
  - docker-compose.yml
  - scripts/
  - tests/
  - src/
  - logs/
  - data/
  - blockchain.db
  - blockchain.db-shm
  - blockchain.db-wal
